{% extends "base.html" %}
{% block title %}Staff login{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:8vh auto">
  <h1>Staff login</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="field"><label for="id_username">Username</label>{{ form.username }}</div>
    <div class="field"><label for="id_password">Password</label>{{ form.password }}</div>
    {% if form.errors %}<p class="errorlist">Wrong username or password.</p>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary big">Log in</button>
  </form>
</div>
{% endblock %}
